<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RP Grit Specifications</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1e293b" />
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --accent: #38bdf8;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; padding-bottom: 32px; }
    header { margin-bottom: 16px; text-align: center; }
    h1 { font-size: 1.35rem; color: #fff; margin-bottom: 6px; }
    p.subtitle { font-size: 0.8rem; color: var(--subtext); }
    .search-box {
      width: 100%;
      padding: 12px 14px;
      font-size: 0.95rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: #fff;
      margin-bottom: 16px;
      outline: none;
    }
    .search-box:focus { border-color: var(--accent); }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      margin-bottom: 10px;
    }
    .grade-title { font-size: 1.15rem; font-weight: 700; color: var(--accent); }
    .ip-tag { font-size: 0.75rem; background: #334155; padding: 2px 8px; border-radius: 4px; color: #e2e8f0; }
    .meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 0.82rem;
    }
    .meta-item { background: #0f172a; padding: 6px 10px; border-radius: 6px; }
    .meta-item span { color: var(--subtext); display: block; font-size: 0.72rem; }
    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.78rem; text-align: center; }
    th, td { border: 1px solid var(--border); padding: 6px 4px; }
    th { background: #0f172a; color: var(--subtext); font-weight: 500; }
    td.sieve-label { font-weight: 600; color: #fff; }
    td.sieve-val { color: #38bdf8; }
  </style>
</head>
<body>
  <header>
    <h1>RP Grit Specifications</h1>
    <p class="subtitle">Quick Offline Reference</p>
  </header>

  <input type="text" id="search" class="search-box" placeholder="Search by Grade or IP ID..." />
  <div id="specs-list"></div>

  <script>
    // Embedded Grit Data from your Excel sheet
    const specs = [
      {
        grade: "7/12",
        ipId: "IP-SRP 7/12 V2",
        bd: "1.37 Min",
        mi: "0.06 Max",
        sieves: [
          { name: "S1", mesh: "6", spec: "0-10" },
          { name: "S2", mesh: "8", spec: "15-30" },
          { name: "S3", mesh: "10", spec: "15-30" },
          { name: "S4", mesh: "14", spec: "40-60" },
          { name: "S5", mesh: "16", spec: "15 Max" },
          { name: "PAN", mesh: "-16", spec: "5 Max" }
        ]
      },
      {
        grade: "14/30",
        ipId: "IP-SRP 14/30 V2",
        bd: "1.56 MIN",
        mi: "0.06 Max",
        sieves: [
          { name: "S1", mesh: "-", spec: "-" },
          { name: "S2", mesh: "12", spec: "0" },
          { name: "S3", mesh: "18", spec: "30-40" },
          { name: "S4", mesh: "30", spec: "80-90 CUM" },
          { name: "S5", mesh: "40", spec: "10 MAX" },
          { name: "PAN", mesh: "-40", spec: "10 MAX" }
        ]
      },
      {
        grade: "14/28 CAL",
        ipId: "IP-SRP 14/28",
        bd: "1.5 MIN",
        mi: "0.15 MAX",
        sieves: [
          { name: "S1", mesh: "-", spec: "-" },
          { name: "S2", mesh: "8", spec: "0" },
          { name: "S3", mesh: "14", spec: "10 MAX" },
          { name: "S4", mesh: "30", spec: "80 MIN" },
          { name: "S5", mesh: "40", spec: "95-100 CUM" },
          { name: "PAN", mesh: "-40", spec: "10 MAX" }
        ]
      },
      {
        grade: "-10+35",
        ipId: "IP-SREF -10+35",
        bd: "1.5 MIN",
        mi: "0.08 MAX",
        sieves: [
          { name: "S1", mesh: "-", spec: "-" },
          { name: "S2", mesh: "-", spec: "-" },
          { name: "S3", mesh: "10", spec: "2 MAX" },
          { name: "S4", mesh: "20", spec: "75-90" },
          { name: "S5", mesh: "35", spec: "5-10" },
          { name: "PAN", mesh: "-35", spec: "0-5" }
        ]
      },
      {
        grade: "-20+70",
        ipId: "IP-SREF -20+70",
        bd: "1.6 MIN",
        mi: "0.08 MAX",
        sieves: [
          { name: "S1", mesh: "-", spec: "-" },
          { name: "S2", mesh: "20", spec: "0-3" },
          { name: "S3", mesh: "30", spec: "9-43" },
          { name: "S4", mesh: "50", spec: "39-65" },
          { name: "S5", mesh: "70", spec: "5-32" },
          { name: "PAN", mesh: "-70", spec: "0-8" }
        ]
      },
      {
        grade: "1-3 MM",
        ipId: "IP-SRP 1-3MM",
        bd: "-",
        mi: "0.15 MAX",
        sieves: [
          { name: "S1", mesh: "-", spec: "-" },
          { name: "S2", mesh: "6", spec: "3 MAX" },
          { name: "S3", mesh: "7", spec: "10 MAX" },
          { name: "S4", mesh: "16", spec: "80-100 CUM" },
          { name: "S5", mesh: "18", spec: "97-100 CUM" },
          { name: "PAN", mesh: "-18", spec: "5 Max" }
        ]
      },
      {
        grade: "30/90 GEN",
        ipId: "IP-CRUCI 30/90 GEN",
        bd: "1.5 MIN",
        mi: "0.4 MAX",
        sieves: [
          { name: "S1", mesh: "-", spec: "-" },
          { name: "S2", mesh: "-", spec: "-" },
          { name: "S3", mesh: "20", spec: "0" },
          { name: "S4", mesh: "30", spec: "5 MAX" },
          { name: "S5", mesh: "80", spec: "90 MIN" },
          { name: "PAN", mesh: "-80", spec: "5 Max" }
        ]
      },
      {
        grade: "JT 75",
        ipId: "IP-CRUCI JT-75",
        bd: "-",
        mi: "0.2 MAX",
        sieves: [
          { name: "S1", mesh: "18", spec: "-" },
          { name: "S2", mesh: "45", spec: "1 MAX" },
          { name: "S3", mesh: "80", spec: "53-67" },
          { name: "S4", mesh: "120", spec: "20-40" },
          { name: "S5", mesh: "200", spec: "5-15" },
          { name: "PAN", mesh: "-200", spec: "3 MAX" }
        ]
      }
    ];

    const listContainer = document.getElementById('specs-list');
    const searchInput = document.getElementById('search');

    function render(items) {
      listContainer.innerHTML = items.map(item => `
        <div class="card">
          <div class="card-header">
            <span class="grade-title">${item.grade}</span>
            <span class="ip-tag">${item.ipId || 'N/A'}</span>
          </div>
          <div class="meta-grid">
            <div class="meta-item"><span>Bulk Density (BD)</span><strong>${item.bd || '-'}</strong></div>
            <div class="meta-item"><span>Magnetic Iron (MI)</span><strong>${item.mi || '-'}</strong></div>
          </div>
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  ${item.sieves.map(s => `<th>${s.name}</th>`).join('')}
                </tr>
              </thead>
              <tbody>
                <tr>
                  ${item.sieves.map(s => `<td class="sieve-label">${s.mesh}</td>`).join('')}
                </tr>
                <tr>
                  ${item.sieves.map(s => `<td class="sieve-val">${s.spec}</td>`).join('')}
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      `).join('');
    }

    render(specs);

    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = specs.filter(s => 
        s.grade.toLowerCase().includes(q) || 
        (s.ipId && s.ipId.toLowerCase().includes(q))
      );
      render(filtered);
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
